{% extends 'base.html' %} {% block content %}
<div class="message-box">
  <div class="header">
    <div class="title">
      <button onclick="goHome()" class="leave-btn">Leave</button>
      <h2>
        <span style="font-weight: normal">Chat room: </span><b>{{code}}</b>
      </h2>
      <h3><i>name: {{name}}</i></h3>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="inputs">
    <input
      type="text"
      rows="3"
      placeholder="Messages"
      name="message"
      id="message"
    />
    <button type="button" name="send" id="send-btn" onclick="sendMessage()">
      Send
    </button>
  </div>
</div>
<script type="text/javascript">
  var socketio = io();

  const messages = document.getElementById("messages");

  const scroll = () => {
    if (messages.lastElementChild) {
      messages.lastElementChild.scrollIntoView({
        behavior: "smooth",
        block: "end",
      });
    }
  };

  const createMessage = (name, msg, datetime) => {
    const content = `
    <div class="text">
        <span>
            <strong>${name}</strong>: ${msg}
        </span>
        <span class="muted">
            ${datetime}
        </span>
    </div>
    `;
    messages.innerHTML += content;
    scroll();
  };

  socketio.on("message", (data) => {
    createMessage(data.name, data.message, data.datetime);
  });

  const goHome = () => {
    socketio.disconnect();
    window.location.href = "{{ url_for('home') }}";
  };

  const sendMessage = () => {
    const message = document.getElementById("message");
    if (message.value == "") return;
    socketio.emit("message", { data: message.value });
    message.value = "";
  };
</script>
{% for msg in messages %}
<script type="text/javascript">
  createMessage("{{msg.name}}", "{{msg.message}}", "{{msg.datetime}}");
  scroll();
</script>
{% endfor %} {% endblock %}
